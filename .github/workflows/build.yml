name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v (e.g. 0.1.0). Creates tag v<version> and a GitHub Release. Leave empty for a plain build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    name: Go tests (with SQL Server and MongoDB)
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Str0ng!Passw0rd'
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Str0ng!Passw0rd' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
      mongo42:
        # Oldest server line still in common use (e.g. Azure Cosmos DB for MongoDB 4.2)
        image: mongo:4.2
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: 'Str0ng!Pass'
        ports: ['27042:27017']
        options: >-
          --health-cmd "mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: 'Str0ng!Pass'
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        env:
          SQLSTUDIO_TEST_SERVER: localhost
          SQLSTUDIO_TEST_USER: sa
          SQLSTUDIO_TEST_PASSWORD: 'Str0ng!Passw0rd'
          SQLSTUDIO_TEST_MONGO_URI: 'mongodb://admin:Str0ng%21Pass@localhost:27017/?authSource=admin'
        run: go test -race ./internal/...
      - name: Test MongoDB 4.2 compatibility
        env:
          SQLSTUDIO_TEST_MONGO_URI: 'mongodb://admin:Str0ng%21Pass@localhost:27042/?authSource=admin'
        run: go test -race -count=1 ./internal/mongo/

  macos:
    name: macOS app (universal)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0-dev+${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          wails build -platform darwin/universal -clean -trimpath -ldflags "-X main.version=${VERSION}"
          # Ad-hoc sign so Apple Silicon will run it (not notarized).
          codesign --force --deep --sign - "build/bin/SQL Studio.app"
      - name: Package
        run: |
          cd build/bin
          ditto -c -k --keepParent "SQL Studio.app" ../../SQL-Studio-macOS-universal.zip
          mkdir dmg && cp -R "SQL Studio.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "SQL Studio" -srcfolder dmg -ov -format UDZO ../../SQL-Studio-macOS-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: SQL-Studio-macOS
          path: |
            SQL-Studio-macOS-universal.zip
            SQL-Studio-macOS-universal.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: SQL Studio v${{ env.VERSION }}
          generate_release_notes: true
          body: |
            Lightweight SQL Server / Azure SQL and MongoDB client for macOS (universal: Apple Silicon + Intel).

            **Homebrew:** `brew tap thennavanr/sql-studio https://github.com/thennavanr/sql-studio && brew install --cask --appdir ~/Applications thennavanr/sql-studio/sql-studio` (upgrade with `brew upgrade --cask sql-studio`).

            **Install:** download `SQL-Studio-macOS-universal.dmg`, drag **SQL Studio** to Applications.
            The app is ad-hoc signed but not notarized — on first launch right-click → **Open**, or run:
            ```sh
            xattr -dr com.apple.quarantine "/Applications/SQL Studio.app"
            ```
          files: |
            SQL-Studio-macOS-universal.zip
            SQL-Studio-macOS-universal.dmg
      - name: Update Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        run: |
          SHA=$(shasum -a 256 SQL-Studio-macOS-universal.dmg | cut -d' ' -f1)
          git fetch origin main
          git checkout -B cask-update origin/main
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/sql-studio.rb
          if git diff --quiet; then echo "Cask already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Cask: sql-studio ${VERSION}"
          git push origin HEAD:main
